apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-pool
  namespace: f5-bnk
spec:
  gatewayClassName: gateway-class
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: gw-settings-pool
  listeners:
  - allowedRoutes:
     kinds:
     - group: gateway.networking.k8s.io
       kind: HTTPRoute
    namespaces:
     from: All
    hostname: app-pool.bnpp.com
    name: http
    port: 80
    protocol: HTTP
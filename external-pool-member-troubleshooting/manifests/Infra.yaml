apiVersion: gateway.k8s.f5.com/v1alpha1
kind: Infra
metadata:
  name: cloud-infra
  namespace: f5-bnk
spec:
  ipams:
  # CIDR block for external VLAN
  - name: external-vlan-ipam
    infobloxNetview: staging-small
    ipPools:
    - cidr: 10.102.18.0/23
      availabilityZone: gg-abc-1
    - cidr: 10.103.66.0/23
      availabilityZone: gg-abc-2
    - cidr: 10.104.130.0/23
      availabilityZone: gg-abc-3
  # CIDR block for VIP listener
  - name: vip-listener-ipam
    infobloxNetview: staging-small
    ipPools:
    - cidr: 10.132.18.0/23
      availabilityZone: gg-abc-1
    - cidr: 10.133.18.0/23
      availabilityZone: gg-abc-2
    - cidr: 10.134.18.0/23
      availabilityZone: gg-abc-3
  - name: vip-listener-ipam2
    infobloxNetview: staging-small
    ipPools:
    - cidr: 10.133.36.0/22
      availabilityZone: gg-abc-1
    - cidr: 10.138.36.0/22
      availabilityZone: gg-abc-2
    - cidr: 10.144.36.0/22
      availabilityZone: gg-abc-3
  # CIDR block for egress SNAT
  - name: egress-snat-ipam
    infobloxNetview: staging-small
    ipPools:
    - cidr: 10.12.11.0/24
      availabilityZone: gg-abc-1
    - cidr: 10.22.21.0/24
      availabilityZone: gg-abc-2
    - cidr: 10.32.31.0/24
      availabilityZone: gg-abc-3
  # Network attachment definition for external VLAN
  networkAttachments:
  - name: external-vlan-nad
    networkAttachmentDefinitions:
    - name: ens3-ipvlan-l2
  networks:
  # External VLAN network configuration uses
  # external-vlan-nad network attachment definition and
  # external-vlan-ipam IPAM configuration
  - name: external-vlan
    type: vlan
    vlan:
      mtu: 1500
      networkAttachmentRef:
        name: external-vlan-nad
      ipamRefs:
      - name: external-vlan-ipam
  # Egress defaults configuration for vxlan subnets over external VLAN network
  egressDefaults:
    networkRef:
      name: external-vlan
    port: 6779
    subnet: 40.0.0.0/16
  # Static Routes for Local VSI and Remote VSI with gateway ip as nexthop
  # for different availability zones
  staticRoutes:
  - name: static-route-client-z1
    destinations:
    - 10.238.69.0/24
    - 10.232.0.0/24
    nextHop: 10.102.18.1
  - name: static-route-client-z2
    destinations:
    - 10.238.69.0/24
    - 10.232.0.0/24
    nextHop: 10.103.66.1
  - name: static-route-client-z3
    destinations:
    - 10.238.69.0/24
    - 10.232.0.0/24
    nextHop: 10.104.130.1
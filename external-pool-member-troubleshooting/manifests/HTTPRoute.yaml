apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-pool
  namespace: ns-ext
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw-pool
    namespace: f5-bnk
  sectionName: http
  rules:
  - backendRefs:
    - group: k8s.f5net.com
      kind: Pool
      name: infra-backend-pool
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
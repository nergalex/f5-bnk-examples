# ==============================================================================
# Configuration for bnk-install-uninstall.sh (non-interactive install)
# ==============================================================================
# f5-bigip-k8s-manifest        : f5-bigip-k8s-manifest chart version to pull
# far-account-key              : FAR service account JSON key file
# cert-manager-version         : cert-manager (Jetstack) chart version
# cert-mgr-clusterissuer-name  : ClusterIssuer name to wait for (Ready=True)
# far-secret-name              : name of the generated image pull secret
# cneinstance-cr               : CNEInstance CR manifest to apply in f5-bnk
# nad-name                     : NetworkAttachmentDefinition name (generated dynamically)
# gtm-bigip-url                 External BIG-IP (CIS) address as <ip>:<port> or a URL
# gtm-bigip-username/password  : External BIG-IP (CIS) credentials
# jwt                          : License JWT token (may reference an env var, e.g. "$JWT")
# ==============================================================================

f5-bigip-k8s-manifest: "2.4.0"
far-account-key: "cne_pull_64.json"
cert-manager-version: "1.16.1"
cert-mgr-clusterissuer-name: "ext-ca-cluster-issuer"
far-secret-name: "far-secret"
cneinstance-cr: "cneinstance-cr.yaml"
nad-name: "ens3-ipvlan-l2"
gtm-bigip-url: "test.acme.com"
gtm-bigip-username: "XXX"
gtm-bigip-password: "XXX"
jwt: "XXX.XXX.XXX"
